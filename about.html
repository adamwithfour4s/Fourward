<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

    #back-link:hover { color: #fff; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    footer { padding: 32px 40px; }
