<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --white: #ffffff;
      --muted: rgba(255,255,255,0.46);
      --sans: 'Google Sans Flex', sans-serif;
      --serif: 'Radley', Georgia, serif;
      --col: 20vw; /* 1 column = 1/5 viewport */
    }

    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--white); overflow: hidden; }

    #page { width: 100vw; height: 100vh; display: flex; }

    /* ── SIDEBAR: 1 column wide, inner padding leaves 1/4 col gap on right ── */
    #sidebar {
      width: var(--col);
      flex-shrink: 0;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      /* right padding = 1/4 of col width = 5vw */
      padding: 30px 5vw 28px 24px;
      z-index: 2;
    }

    #logo { cursor: pointer; display: inline-block; }
    #logo img { height: 14px; width: auto; opacity: 0.90; }

    /* nav row: left arrow + right arrow, no text */
    #nav-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 28px;
    }

    .nav-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.30);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
      text-decoration: none; color: var(--white);
      opacity: 0.50; transition: opacity 0.2s;
      background: none;
    }
    .nav-btn:hover { opacity: 1; }
    .nav-btn.disabled { opacity: 0.14; pointer-events: none; }
    .nav-btn svg { width: 10px; height: 10px; }

    #art-info { margin-top: auto; margin-bottom: auto; padding: 24px 0; }

    #art-title  { font-family: var(--sans); font-size: 18px; font-weight: 700; line-height: 1.2; margin-bottom: 3px; }
    #art-artist { font-family: var(--serif); font-size: 18px; font-style: italic; line-height: 1.2; margin-bottom: 2px; color: rgba(255,255,255,0.80); }
    #art-year   { font-family: var(--serif); font-size: 18px; font-style: italic; color: var(--muted); margin-bottom: 18px; }
    #divider    { width: 34px; height: 1px; background: rgba(255,255,255,0.18); margin-bottom: 15px; }
    #art-desc   { font-family: var(--sans); font-size: 14px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.56); }

    #sidebar-bottom { margin-top: auto; }
    #learn-more {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--white); text-decoration: none;
      opacity: 0.50; transition: opacity 0.2s; display: block;
    }
    #learn-more:hover { opacity: 1; }

    /* ── PAINTING PANEL: 4 columns ── */
    #painting-panel {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #060606;
    }

    #painting-img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: left center;
      display: block;
      opacity: 0; transition: opacity 1.1s ease;
    }
    #painting-img.loaded { opacity: 1; }

    #painting-loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--sans); font-size: 13px;
      color: var(--muted); font-style: italic; pointer-events: none;
    }

    /* archive link top-right */
    #topright {
      position: absolute; top: 28px; right: 32px;
      display: flex; align-items: center; gap: 24px; z-index: 3;
    }
    #topright a {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.60); text-decoration: none;
      transition: color 0.2s; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #topright a:hover { color: var(--white); }

    /* VIEW IN FULL button — bottom right */
    #view-full-btn {
      position: absolute; bottom: 28px; right: 32px; z-index: 3;
      background: var(--white); color: #0D0D0D;
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer;
      padding: 9px 16px;
      transition: opacity 0.2s;
    }
    #view-full-btn:hover { opacity: 0.85; }

    /* Full painting overlay */
    #full-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 4;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #full-overlay.visible { display: flex; pointer-events: auto; }

    #full-overlay img {
      width: 60%;
      height: auto;
      max-height: 90%;
      object-fit: contain;
      border: 1px solid #ffffff;
      display: block;
    }
  </style>
</head>
<body>
<div id="page">

  <div id="sidebar">
    <a id="logo" href="index.html"><img src="logo.png" alt="Fourward" /></a>

    <div id="nav-row">
      <a id="nav-prev" class="nav-btn disabled" href="#">
        <svg viewBox="0 0 10 10" fill="none"><path d="M6.5 1.5L2.5 5L6.5 8.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a id="nav-next" class="nav-btn disabled" href="#">
        <svg viewBox="0 0 10 10" fill="none"><path d="M3.5 1.5L7.5 5L3.5 8.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <div id="art-info">
      <div id="art-title"></div>
      <div id="art-artist"></div>
      <div id="art-year"></div>
      <div id="divider"></div>
      <div id="art-desc"></div>
    </div>

    <div id="sidebar-bottom">
      <a id="learn-more" href="#" target="_blank">Learn More</a>
    </div>
  </div>

  <div id="painting-panel">
    <div id="topright"><a href="archive.html">Archive</a></div>
    <div id="painting-loader">Loading…</div>
    <img id="painting-img" alt="" />
    <button id="view-full-btn">View in Full</button>
    <div id="full-overlay">
      <img id="full-img" src="" alt="" />
    </div>
  </div>

</div>
<script>
// ── ARTWORKS ──────────────────────────────────────────────────
// imageFile = exact Wikimedia Commons filename for guaranteed image lookup
// wikiPage  = Wikipedia article title for fallback API lookup
const ARTWORKS = [
  {
    title: "The Raft of the Medusa",
    artist: "Théodore Géricault",
    date: "1818–1819",
    imageFile: "Théodore_Géricault_-_The_Raft_of_the_Medusa_-_WGA08630.jpg",
    wikiPage: "The_Raft_of_the_Medusa",
    desc: "Géricault spent two years on this. He visited morgues, interviewed survivors, and had a life-size raft built in his studio. Of 147 people set adrift after the wreck, only 15 survived. He was 27 when he finished it. Critics were horrified. It became an icon."
  },
  {
    title: "The Third of May 1808",
    artist: "Francisco Goya",
    date: "1814",
    imageFile: "El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_in_Google_Earth.jpg",
    wikiPage: "The_Third_of_May_1808",
    desc: "Spanish rebels executed at night by French soldiers who have no faces — only rifles. The man in the white shirt throws his arms wide. The lantern on the ground is the only light. Goya painted this six years after the event, once the French had gone."
  },
  {
    title: "The Nightmare",
    artist: "Henry Fuseli",
    date: "1781",
    imageFile: "John_Henry_Fuseli_-_The_Nightmare.JPG",
    wikiPage: "The_Nightmare_(Fuseli)",
    desc: "A woman lies unconscious as a goblin crouches on her chest. A horse's white blind eye stares from behind a curtain. Fuseli painted the unconscious as a place occupied by other things. When exhibited in 1782 it was the most talked-about painting in London."
  },
  {
    title: "The Isle of the Dead",
    artist: "Arnold Böcklin",
    date: "1886",
    imageFile: "Isle_of_the_Dead_(Hermitage_Version).jpg",
    wikiPage: "Isle_of_the_Dead_(painting)",
    desc: "A white-shrouded figure stands in a boat approaching a dark island of cypress trees and sheer rock. Böcklin painted five versions and refused to explain any of them. Freud owned a print. Hitler owned a version. It was the most reproduced painting in the German-speaking world at the turn of the century."
  },
  {
    title: "Death on a Pale Horse",
    artist: "Benjamin West",
    date: "1796",
    imageFile: "Death-on-a-pale-horse-west-1796.jpg",
    wikiPage: "Death_on_the_Pale_Horse",
    desc: "The four horsemen of the apocalypse, with bodies writhing beneath them. West worked on versions of this composition for thirty years. No painting of its era attempted this much chaos and kept it legible. The pale horse at the center is the painting's cold engine."
  },
  {
    title: "A Lion Attacking a Horse",
    artist: "George Stubbs",
    date: "1762",
    imageFile: "George_Stubbs_-_A_Lion_Attacking_a_Horse_-_Google_Art_Project.jpg",
    wikiPage: "A_Lion_Attacking_a_Horse",
    desc: "A white horse rears in terror as a lion mounts its back and sinks its claws in. Stubbs painted this subject seventeen times across thirty years. He was a trained anatomist. The terror is precise. Géricault studied these paintings obsessively."
  },
  {
    title: "A Philosopher Lecturing on the Orrery",
    artist: "Joseph Wright of Derby",
    date: "1766",
    imageFile: "Joseph_Wright_of_Derby_-_Philosopher_giving_a_lecture_on_the_orrery_-_Google_Art_Project.jpg",
    wikiPage: "A_Philosopher_Lecturing_on_the_Orrery",
    desc: "A mechanical model of the solar system glows in a dark room. The faces around it are lit from below — awe, fear, concentration. Wright painted candlelight the way Caravaggio painted torchlight: as a force that reveals what darkness conceals."
  },
  {
    title: "An Experiment on a Bird in the Air Pump",
    artist: "Joseph Wright of Derby",
    date: "1768",
    imageFile: "An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby,_1768.jpg",
    wikiPage: "An_Experiment_on_a_Bird_in_the_Air_Pump",
    desc: "A scientist removes air from a glass globe containing a live bird. Some watch with scientific detachment. A girl turns away. Two children hold each other. The scientist looks directly at us. Wright gives no verdict — only the moment before the choice is made."
  },
  {
    title: "The Seventh Plague of Egypt",
    artist: "John Martin",
    date: "1823",
    imageFile: "Martin,_John_-_The_Seventh_Plague_-_1823.jpg",
    wikiPage: "The_Seventh_Plague_of_Egypt",
    desc: "Fire and hail rain from an apocalyptic sky onto Egypt. Moses stands with his staff. The human figures are tiny — barely visible against what's falling from above. Martin specialized in making people look insignificant. He considered that the point."
  }
];

// ── ROUTING ───────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const TOTAL   = ARTWORKS.length;
const LAST    = TOTAL - 1;

let idx = params.has('day')
  ? ((parseInt(params.get('day'), 10) % TOTAL) + TOTAL) % TOTAL
  : LAST;

const artwork = ARTWORKS[idx];

// nav: prev
const prevBtn = document.getElementById('nav-prev');
if (idx > 0) { prevBtn.classList.remove('disabled'); prevBtn.href = `index.html?day=${idx - 1}`; }

// nav: next (disabled on today = last entry)
const nextBtn = document.getElementById('nav-next');
if (idx < LAST) { nextBtn.classList.remove('disabled'); nextBtn.href = `index.html?day=${idx + 1}`; }

// fill text
document.getElementById('art-title').textContent  = artwork.title;
document.getElementById('art-artist').textContent = artwork.artist;
document.getElementById('art-year').textContent   = artwork.date;
document.getElementById('art-desc').textContent   = artwork.desc;
document.getElementById('learn-more').href = `https://en.wikipedia.org/wiki/${artwork.wikiPage}`;

// ── IMAGE LOADING ─────────────────────────────────────────────
// Strategy: use Wikimedia Commons Special:FilePath which redirects
// to the actual image — fully CORS-safe from browsers.
const loader   = document.getElementById('painting-loader');
const paintImg = document.getElementById('painting-img');
const fullImg  = document.getElementById('full-img');

function buildCommonsUrl(filename, width) {
  // Wikipedia thumbnail API — resolves any Commons file to a sized thumb
  return `https://en.wikipedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(filename)}&prop=imageinfo&iiprop=url&iiurlwidth=${width}&format=json&origin=*`;
}

async function loadImage() {
  try {
    const res  = await fetch(buildCommonsUrl(artwork.imageFile, 2400));
    const data = await res.json();
    const pages = data.query.pages;
    const page  = pages[Object.keys(pages)[0]];
    const info  = page?.imageinfo?.[0];
    const src   = info?.thumburl || info?.url;

    if (!src) { loader.textContent = 'Image unavailable'; return; }

    paintImg.src = src;
    paintImg.alt = artwork.title;
    fullImg.src  = src;
    fullImg.alt  = artwork.title;

    paintImg.onload = () => {
      paintImg.classList.add('loaded');
      loader.style.display = 'none';
    };
    paintImg.onerror = () => {
      // fallback: try Wikipedia pageimages API
      loadFallback();
    };
  } catch(e) {
    loadFallback();
  }
}

async function loadFallback() {
  try {
    const url  = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(artwork.wikiPage)}&prop=pageimages&pithumbsize=2400&format=json&origin=*`;
    const res  = await fetch(url);
    const data = await res.json();
    const page = Object.values(data.query.pages)[0];
    const src  = page?.thumbnail?.source?.replace(/\/\d+px-/, '/2400px-');

    if (!src) { loader.textContent = 'Image unavailable'; return; }

    paintImg.src = src;
    fullImg.src  = src;
    paintImg.onload = () => { paintImg.classList.add('loaded'); loader.style.display = 'none'; };
    paintImg.onerror = () => { loader.textContent = 'Image unavailable'; };
  } catch(e) {
    loader.textContent = 'Could not load image.';
  }
}

loadImage();

// ── VIEW IN FULL toggle ───────────────────────────────────────
const overlay    = document.getElementById('full-overlay');
const viewBtn    = document.getElementById('view-full-btn');
let fullVisible  = false;

viewBtn.addEventListener('click', () => {
  fullVisible = !fullVisible;
  overlay.classList.toggle('visible', fullVisible);
  viewBtn.textContent = fullVisible ? 'Close' : 'View in Full';
});

// click outside the inner image to close
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    fullVisible = false;
    overlay.classList.remove('visible');
    viewBtn.textContent = 'View in Full';
  }
});
</script>
</body>
</html>
