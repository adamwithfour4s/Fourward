<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --white: #ffffff;
      --muted: rgba(255,255,255,0.48);
      --sans: 'Google Sans Flex', sans-serif;
      --serif: 'Radley', Georgia, serif;
      /* sidebar = 1/5 of viewport */
      --sidebar: 20vw;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
    }

    /* ── LAYOUT ──────────────────────────────────── */
    #page {
      width: 100vw; height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR (leftmost 1/5) ──────────────────── */
    #sidebar {
      width: var(--sidebar);
      min-width: 200px;
      max-width: 320px;
      flex-shrink: 0;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 32px 26px 28px;
      z-index: 2;
      position: relative;
    }

    /* logo top */
    #logo img { height: 14px; width: auto; opacity: 0.90; }

    /* prev nav */
    #nav-prev {
      display: flex; align-items: center; gap: 10px;
      margin-top: 30px;
      color: var(--white); text-decoration: none;
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.52; transition: opacity 0.2s; width: fit-content;
    }
    #nav-prev:hover { opacity: 1; }
    #nav-prev.disabled { opacity: 0.14; pointer-events: none; }

    .arrow-circle {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.32);
      display: flex; align-items: center; justify-content: center;
    }
    .arrow-circle svg { width: 10px; height: 10px; }

    /* art info pushed to vertical center */
    #art-info {
      margin-top: auto;
      margin-bottom: auto;
      padding: 32px 0;
    }

    #art-title {
      font-family: var(--sans); font-size: 18px; font-weight: 700;
      line-height: 1.2; margin-bottom: 3px;
    }
    #art-artist {
      font-family: var(--serif); font-size: 18px; font-style: italic;
      line-height: 1.2; margin-bottom: 2px;
      color: rgba(255,255,255,0.80);
    }
    #art-year {
      font-family: var(--serif); font-size: 18px; font-style: italic;
      color: var(--muted); margin-bottom: 18px;
    }
    #divider {
      width: 36px; height: 1px;
      background: rgba(255,255,255,0.20);
      margin-bottom: 16px;
    }
    #art-desc {
      font-family: var(--sans); font-size: 14px; font-weight: 400;
      line-height: 1.5; color: rgba(255,255,255,0.58);
    }

    /* bottom */
    #sidebar-bottom {
      margin-top: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    #learn-more {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--white); text-decoration: none;
      opacity: 0.52; transition: opacity 0.2s; width: fit-content;
    }
    #learn-more:hover { opacity: 1; }
    #logo-44 img { height: 14px; width: auto; opacity: 0.22; }

    /* ── PAINTING PANEL (rightmost 4/5) ──────────── */
    #painting-panel {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #080808;
    }

    /* painting: right-aligned, full height, crops left if too wide */
    #painting-img {
      position: absolute;
      top: 0;
      right: 0;          /* anchor to right edge */
      height: 100%;
      width: auto;
      max-width: none;
      display: block;
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    #painting-img.loaded { opacity: 1; }

    #painting-loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--sans); font-size: 13px;
      color: var(--muted); font-style: italic;
      pointer-events: none;
    }

    /* top-right nav */
    #topright {
      position: absolute; top: 30px; right: 34px;
      display: flex; align-items: center; gap: 26px;
      z-index: 3;
    }
    #topright a {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); text-decoration: none;
      transition: color 0.2s; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    #topright a:hover { color: var(--white); }
  </style>
</head>
<body>
<div id="page">

  <div id="sidebar">
    <div id="logo"><img src="logo.png" alt="Fourward" /></div>

    <a id="nav-prev" href="#" class="disabled">
      <span class="arrow-circle">
        <svg viewBox="0 0 10 10" fill="none"><path d="M6.5 1.5L2.5 5L6.5 8.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      View Previous
    </a>

    <div id="art-info">
      <div id="art-title"></div>
      <div id="art-artist"></div>
      <div id="art-year"></div>
      <div id="divider"></div>
      <div id="art-desc"></div>
    </div>

    <div id="sidebar-bottom">
      <a id="learn-more" href="#" target="_blank">Learn More</a>
      <div id="logo-44"><img src="44.png" alt="44" /></div>
    </div>
  </div>

  <div id="painting-panel">
    <div id="topright">
      <a href="about.html">About</a>
      <a href="archive.html">Archive</a>
    </div>
    <div id="painting-loader">Loading…</div>
    <img id="painting-img" alt="" />
  </div>

</div>
<script>
// ── ARTWORKS ──────────────────────────────────────────────────
// All wide-format paintings. Images loaded via Wikipedia API
// (CORS-safe) using the article title to get the main image.
// wikiTitle = the exact Wikipedia article title for this painting.
const ARTWORKS = [
  {
    title: "The Raft of the Medusa",
    artist: "Théodore Géricault",
    date: "1818–1819",
    wikiTitle: "The_Raft_of_the_Medusa",
    wikiPage: "The_Raft_of_the_Medusa",
    desc: "Géricault spent two years on this. He visited morgues, interviewed survivors, had a life-size raft built in his studio. Of 147 people set adrift after the wreck of the Medusa, only 15 survived. He was 27 when he finished it. It was rejected by critics and became an icon."
  },
  {
    title: "The Third of May 1808",
    artist: "Francisco Goya",
    date: "1814",
    wikiPage: "The_Third_of_May_1808",
    desc: "Spanish rebels are executed at night by French soldiers who have no faces — only the geometry of rifles. The man in the white shirt throws his arms wide. The lantern on the ground is the only light. Goya painted this six years after the event, once the French had left."
  },
  {
    title: "Two Men Contemplating the Moon",
    artist: "Caspar David Friedrich",
    date: "1825–1830",
    wikiPage: "Two_Men_Contemplating_the_Moon",
    desc: "Two figures on a path look up at a crescent moon through gnarled oak trees. Friedrich painted this subject four times. The figures are always small, always still, always facing away. The moon is not romantic here — it is remote, indifferent, and perfect."
  },
  {
    title: "Death on a Pale Horse",
    artist: "Benjamin West",
    date: "1796",
    wikiPage: "Death_on_a_Pale_Horse_(West)",
    desc: "The four horsemen of the apocalypse, rendered at full scale with writhing bodies below them. West worked on versions of this for thirty years. No painting of the period attempted this much chaos and kept it legible. The pale horse at the center is the painting's cold engine."
  },
  {
    title: "The Seventh Plague of Egypt",
    artist: "John Martin",
    date: "1823",
    wikiPage: "John_Martin_(painter)",
    desc: "Fire and hail rain from an apocalyptic sky onto Egypt. Martin specialized in making humans look completely insignificant against the scale of divine punishment. The figures here are tiny. The sky takes up most of the canvas. That was always his point."
  }
];

// ── ROUTING ───────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const TOTAL  = ARTWORKS.length;

let idx = params.has('day')
  ? ((parseInt(params.get('day'), 10) % TOTAL) + TOTAL) % TOTAL
  : TOTAL - 1; // default: show newest (last) entry

const artwork = ARTWORKS[idx];

// prev link
const prevLink = document.getElementById('nav-prev');
if (idx > 0) {
  prevLink.classList.remove('disabled');
  prevLink.href = `index.html?day=${idx - 1}`;
}

// fill text immediately
document.getElementById('art-title').textContent  = artwork.title;
document.getElementById('art-artist').textContent = artwork.artist;
document.getElementById('art-year').textContent   = artwork.date;
document.getElementById('art-desc').textContent   = artwork.desc;
document.getElementById('learn-more').href =
  `https://en.wikipedia.org/wiki/${artwork.wikiPage}`;

// ── LOAD IMAGE via Wikipedia API (CORS-safe) ──────────────────
// Requests the largest available thumbnail for the article's lead image.
async function loadImage() {
  const loader = document.getElementById('painting-loader');
  const img    = document.getElementById('painting-img');

  try {
    // Step 1: get the lead image filename from the page
    const infoUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(artwork.wikiPage)}&prop=pageimages&pithumbsize=2400&format=json&origin=*`;
    const infoRes = await fetch(infoUrl);
    const infoData = await infoRes.json();
    const pages = infoData.query.pages;
    const page  = pages[Object.keys(pages)[0]];

    const src = page?.thumbnail?.source;

    if (!src) {
      loader.textContent = 'Image unavailable';
      return;
    }

    // Step 2: bump up the size in the URL (Wikipedia thumb URLs let you do this)
    // Pattern: /WIDTHpx- → replace with /2400px-
    const hiResSrc = src.replace(/\/\d+px-/, '/2400px-');

    img.src = hiResSrc;
    img.alt = artwork.title;
    img.onload = () => {
      img.classList.add('loaded');
      loader.style.display = 'none';
    };
    img.onerror = () => {
      // fallback to original thumbnail size
      img.src = src;
      img.onload = () => { img.classList.add('loaded'); loader.style.display = 'none'; };
      img.onerror = () => { loader.textContent = 'Image unavailable'; };
    };

  } catch(e) {
    loader.textContent = 'Could not load image.';
  }
}

loadImage();
</script>
</body>
</html>
