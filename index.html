<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --white: #FFFFFF;
      --muted: rgba(255,255,255,0.50);
      --sidebar: 260px;
      --sans: 'Google Sans Flex', sans-serif;
      --serif: 'Radley', Georgia, serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
    }

    /* ── LAYOUT: sidebar left, painting right ───── */
    #page {
      width: 100vw; height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 32px 28px;
      position: relative;
      z-index: 2;
      background: var(--bg);
    }

    #logo { margin-bottom: auto; }
    #logo img { height: 15px; width: auto; opacity: 0.92; }

    #nav-prev {
      display: flex; align-items: center; gap: 10px;
      margin-top: 32px; margin-bottom: 0;
      color: var(--white); text-decoration: none;
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.55; transition: opacity 0.2s; width: fit-content;
    }
    #nav-prev:hover { opacity: 1; }
    #nav-prev.disabled { opacity: 0.15; pointer-events: none; }

    .arrow-circle {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .arrow-circle svg { width: 10px; height: 10px; }

    /* push art info to vertical center-ish */
    #art-info {
      margin-top: auto;
      margin-bottom: auto;
      padding-top: 40px;
    }

    #art-title {
      font-family: var(--sans); font-size: 18px; font-weight: 700;
      line-height: 1.2; margin-bottom: 3px;
    }
    #art-artist {
      font-family: var(--serif); font-size: 18px; font-style: italic;
      font-weight: 400; line-height: 1.2; margin-bottom: 2px;
      color: rgba(255,255,255,0.82);
    }
    #art-year {
      font-family: var(--serif); font-size: 18px; font-style: italic;
      color: var(--muted); margin-bottom: 20px;
    }

    #divider {
      width: 40px; height: 1px;
      background: rgba(255,255,255,0.25);
      margin-bottom: 18px;
    }

    #art-desc {
      font-family: var(--sans); font-size: 14px; font-weight: 400;
      line-height: 1.5; color: rgba(255,255,255,0.60);
    }

    /* bottom of sidebar */
    #sidebar-bottom {
      margin-top: auto;
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #learn-more {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--white); text-decoration: none;
      opacity: 0.55; transition: opacity 0.2s; width: fit-content;
    }
    #learn-more:hover { opacity: 1; }

    #logo-44 img { height: 16px; width: auto; opacity: 0.25; }

    /* ── PAINTING PANEL ──────────────────────────── */
    #painting-panel {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* full-bleed image: touch top, bottom, left edge of panel */
    #painting-img {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: auto;
      max-width: none;   /* allow it to be wider than the panel — crops right */
      object-fit: cover;
      object-position: left center;
      display: block;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #painting-img.loaded { opacity: 1; }

    #painting-loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--sans); font-size: 13px;
      color: var(--muted); font-style: italic;
    }

    /* top-right nav */
    #topright {
      position: absolute; top: 32px; right: 36px;
      display: flex; align-items: center; gap: 28px;
      z-index: 3;
    }
    #topright a {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.65); text-decoration: none;
      transition: color 0.2s;
    }
    #topright a:hover { color: var(--white); }
  </style>
</head>
<body>
<div id="page">

  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div id="logo"><img src="logo.png" alt="Fourward" /></div>

    <a id="nav-prev" href="#">
      <span class="arrow-circle">
        <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 1.5L2.5 5L6.5 8.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      View Previous
    </a>

    <div id="art-info">
      <div id="art-title"> </div>
      <div id="art-artist"> </div>
      <div id="art-year"> </div>
      <div id="divider"></div>
      <div id="art-desc"> </div>
    </div>

    <div id="sidebar-bottom">
      <a id="learn-more" href="#" target="_blank">Learn More</a>
      <div id="logo-44"><img src="44.png" alt="44" /></div>
    </div>
  </div>

  <!-- RIGHT: PAINTING -->
  <div id="painting-panel">
    <div id="topright">
      <a href="about.html">About</a>
      <a href="archive.html">Archive</a>
    </div>
    <span id="painting-loader">Loading…</span>
    <img id="painting-img" alt="" />
  </div>

</div>

<script>
// ── CURATED ARTWORKS ─────────────────────────────────────────
// All images verified as public domain with direct URLs.
// Wide/landscape format preferred to fill the right panel.
// metObjectID = use Met API for image | imageUrl = direct URL
const ARTWORKS = [
  {
    title: "The Raft of the Medusa",
    artist: "Théodore Géricault",
    date: "1818–1819",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Théodore_Géricault_-_The_Raft_of_the_Medusa_-_WGA08630.jpg/2560px-Théodore_Géricault_-_The_Raft_of_the_Medusa_-_WGA08630.jpg",
    wikiSlug: "The_Raft_of_the_Medusa",
    desc: "Géricault spent two years preparing this painting. He visited morgues, interviewed survivors, and had a life-size raft built in his studio. 147 people were set adrift after the wreck of the Medusa. Only 15 survived. He was 27 when he painted it."
  },
  {
    title: "Whalers",
    artist: "J. M. W. Turner",
    date: "ca. 1845",
    metObjectID: 437854,
    wikiSlug: "Whalers_(J._M._W._Turner)",
    desc: "A wounded sperm whale thrashes in foam and blood while the killing boats close in. Turner was seventy. Critics said they couldn't find the ship in the paint. He considered that a success."
  },
  {
    title: "Saturn Devouring His Son",
    artist: "Francisco Goya",
    date: "1819–1823",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Francisco_de_Goya%2C_Saturno_devorando_a_su_hijo_%281819-1823%29.jpg/2560px-Francisco_de_Goya%2C_Saturno_devorando_a_su_hijo_%281819-1823%29.jpg",
    wikiSlug: "Saturn_Devouring_His_Son",
    desc: "One of Goya's Black Paintings, found on the walls of his house after his death. Saturn's eyes are white, unhinged. He is eating his own child to prevent being overthrown. Goya painted this for himself alone, in a house he called the House of the Deaf Man."
  },
  {
    title: "Wanderer above the Sea of Fog",
    artist: "Caspar David Friedrich",
    date: "1818",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg/1280px-Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg",
    wikiSlug: "Wanderer_above_the_Sea_of_Fog",
    desc: "A man stands with his back to us on a rocky peak, looking out over clouds. We are placed behind him, which means we are looking with him, not at him. Friedrich invented this device — the Rückenfigur — to make the viewer inhabit the sublime rather than observe it."
  },
  {
    title: "The Great Wave off Kanagawa",
    artist: "Katsushika Hokusai",
    date: "ca. 1831",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Tsunami_by_hokusai_19th_century.jpg/2560px-Tsunami_by_hokusai_19th_century.jpg",
    wikiSlug: "The_Great_Wave_off_Kanagawa",
    desc: "The wave is about to consume the boats beneath it. Mount Fuji sits in the background, small and permanent. Hokusai was in his seventies, calling himself 'the old man mad about painting.' He made thirty-six views of the same mountain. This is the one."
  },
  {
    title: "Judith Slaying Holofernes",
    artist: "Artemisia Gentileschi",
    date: "1614–1620",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Artemisia_Gentileschi_-_Judith_Beheading_Holofernes_-_WGA8563.jpg/2560px-Artemisia_Gentileschi_-_Judith_Beheading_Holofernes_-_WGA8563.jpg",
    wikiSlug: "Judith_Slaying_Holofernes_(Gentileschi,_Naples)",
    desc: "Where Caravaggio painted Judith squeamish and at arm's length, Gentileschi gives her full commitment. The two women lean into the work. Critics argued for centuries that a man must have helped. Gentileschi had survived a rape trial the year before she began this painting."
  },
  {
    title: "The Third of May 1808",
    artist: "Francisco Goya",
    date: "1814",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_in_Google_Earth.jpg/2560px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_in_Google_Earth.jpg",
    wikiSlug: "The_Third_of_May_1808",
    desc: "Spanish rebels are executed by French soldiers in the dark. Goya gives the soldiers no faces — only the geometry of rifles. The man in the white shirt throws his arms wide. The lantern on the ground is the only light. There is no heroism here, only machinery."
  },
  {
    title: "Wheat Field with Cypresses",
    artist: "Vincent van Gogh",
    date: "1889",
    metObjectID: 437984,
    wikiSlug: "Wheat_Field_with_Cypresses",
    desc: "Painted from the asylum grounds at Saint-Rémy, the cypress rising like a dark flame while the sky churns above it. Van Gogh wrote that it was one of his best. He made three versions, unable to leave it alone."
  },
  {
    title: "The Nightmare",
    artist: "Henry Fuseli",
    date: "1781",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/John_Henry_Fuseli_-_The_Nightmare.JPG/2560px-John_Henry_Fuseli_-_The_Nightmare.JPG",
    wikiSlug: "The_Nightmare_(Fuseli)",
    desc: "A woman sprawls unconscious while a goblin crouches on her chest. From behind a curtain, a horse's blind white eye peers in. Fuseli painted the unconscious as a place occupied by other things. When it was exhibited in 1782, it caused a sensation and became one of the most reproduced images of the century."
  },
  {
    title: "The Colossus",
    artist: "Francisco Goya",
    date: "ca. 1808–1812",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Francisco_de_Goya_y_Lucientes_-_The_Colossus_-_Google_Art_Project.jpg/1280px-Francisco_de_Goya_y_Lucientes_-_The_Colossus_-_Google_Art_Project.jpg",
    wikiSlug: "The_Colossus_(Goya)",
    desc: "A giant stands half-obscured by clouds while tiny figures and animals scatter across the plain below. Whether the giant is a threat or a protector is unclear. Goya painted this during the Napoleonic occupation of Spain, when the answer may not have mattered."
  },
  {
    title: "Snow Storm: Steam-Boat off a Harbour's Mouth",
    artist: "J. M. W. Turner",
    date: "1842",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/JMW_Turner_-_Snow_Storm_-_Steam-Boat_off_a_Harbour%27s_Mouth.jpg/2560px-JMW_Turner_-_Snow_Storm_-_Steam-Boat_off_a_Harbour%27s_Mouth.jpg",
    wikiSlug: "Snow_Storm:_Steam-Boat_off_a_Harbour's_Mouth",
    desc: "Turner claimed he had himself tied to a mast for four hours during an actual storm to paint this. Critics called it 'soapsuds and whitewash.' He replied that he did not paint it to be understood, but to show what such a scene was like."
  },
  {
    title: "The Isle of the Dead",
    artist: "Arnold Böcklin",
    date: "1886",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Arnold_Böcklin_-_Die_Toteninsel_III_%28Alte_Nationalgalerie%2C_Berlin%29.jpg/2560px-Arnold_Böcklin_-_Die_Toteninsel_III_%28Alte_Nationalgalerie%2C_Berlin%29.jpg",
    wikiSlug: "Isle_of_the_Dead_(painting)",
    desc: "A white-shrouded figure stands in a small boat approaching a dark island of cypress trees and rock. Böcklin painted five versions and refused to explain it. Freud owned a print. Hitler owned a version. It was one of the most reproduced paintings in the German-speaking world at the turn of the century."
  },
  {
    title: "Dante and Virgil",
    artist: "William-Adolphe Bouguereau",
    date: "1850",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Dante_and_Virgil_in_Hell_%28William-Adolphe_Bouguereau%29.jpg/1280px-Dante_and_Virgil_in_Hell_%28William-Adolphe_Bouguereau%29.jpg",
    wikiSlug: "Dante_and_Virgil_(Bouguereau)",
    desc: "Two damned souls tear at each other in the eighth circle of Hell while Dante and Virgil watch from above. Bouguereau was twenty-four. Critics dismissed it as sensationalist. It is the most violent thing he ever painted, and probably his most alive."
  },
  {
    title: "Don Manuel Osorio Manrique de Zuñiga",
    artist: "Francisco Goya",
    date: "1787–88",
    metObjectID: 49741,
    wikiSlug: "Don_Manuel_Osorio_Manrique_de_Zuñiga",
    desc: "A child in red holds a magpie on a string. Three cats watch the bird with complete focus. Goya painted innocence as something surrounded and temporary. The cats don't blink."
  },
  {
    title: "The Fighting Temeraire",
    artist: "J. M. W. Turner",
    date: "1839",
    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg/2560px-The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg",
    wikiSlug: "The_Fighting_Temeraire",
    desc: "A great warship, white as a ghost, is towed to the breakers by a small black steamboat. The Temeraire fought at Trafalgar. Turner saw it being towed to be broken up and followed it along the Thames. The sun sets in the wrong direction. He didn't care."
  }
];

// ── ROUTING ───────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const TOTAL  = ARTWORKS.length;
const DEFAULT_DAY = TOTAL - 1;

let idx = params.has('day')
  ? ((parseInt(params.get('day'), 10) % TOTAL) + TOTAL) % TOTAL
  : DEFAULT_DAY;

const artwork = ARTWORKS[idx];

// prev link
const prevLink = document.getElementById('nav-prev');
if (idx === 0) {
  prevLink.classList.add('disabled');
} else {
  prevLink.href = `index.html?day=${idx - 1}`;
}

// populate text immediately
document.getElementById('art-title').textContent  = artwork.title;
document.getElementById('art-artist').textContent = artwork.artist;
document.getElementById('art-year').textContent   = artwork.date;
document.getElementById('art-desc').textContent   = artwork.desc;
document.getElementById('learn-more').href = `https://en.wikipedia.org/wiki/${artwork.wikiSlug}`;

// ── LOAD IMAGE ────────────────────────────────────────────────
function setImage(src) {
  const img = document.getElementById('painting-img');
  img.src = src;
  img.onload = () => {
    img.classList.add('loaded');
    document.getElementById('painting-loader').style.display = 'none';
  };
  img.onerror = () => {
    document.getElementById('painting-loader').textContent = 'Image unavailable';
  };
}

if (artwork.imageUrl) {
  setImage(artwork.imageUrl);
} else if (artwork.metObjectID) {
  fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${artwork.metObjectID}`)
    .then(r => r.json())
    .then(data => {
      const src = data.primaryImage || data.primaryImageSmall;
      if (src) setImage(src);
      else document.getElementById('painting-loader').textContent = 'Image unavailable';
    })
    .catch(() => {
      document.getElementById('painting-loader').textContent = 'Could not load image.';
    });
}
</script>
</body>
</html>
