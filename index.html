<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D0D; --white: #ffffff; --muted: rgba(255,255,255,0.46);
      --sans: 'Google Sans Flex', sans-serif; --serif: 'Radley', Georgia, serif;
    }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--white); }

    /* ═══════════════════ DESKTOP ═══════════════════ */
    #page { width: 100vw; height: 100vh; display: flex; overflow: hidden; }

    #sidebar {
      width: 20vw; flex-shrink: 0; height: 100%;
      background: var(--bg); display: flex; flex-direction: column;
      padding: 30px 5vw 28px 24px; z-index: 2;
    }
    #logo { display: inline-block; }
    #logo img { height: 14px; width: auto; opacity: 0.90; }

    #nav-row { display: flex; align-items: center; gap: 10px; margin-top: 28px; }
    .nav-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.30);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; text-decoration: none; color: var(--white);
      opacity: 0.50; transition: opacity 0.2s; background: none;
    }
    .nav-btn:hover { opacity: 1; }
    .nav-btn.disabled { opacity: 0.14; pointer-events: none; }
    .nav-btn svg { width: 10px; height: 10px; }

    #art-info { margin-top: auto; margin-bottom: auto; padding: 24px 0; }
    #art-title { font-family: var(--sans); font-size: 16px; font-weight: 700; line-height: 1.2; margin-bottom: 3px; text-wrap: balance; }
    #art-artist { font-family: var(--serif); font-size: 16px; font-style: italic; line-height: 1.2; margin-bottom: 2px; color: rgba(255,255,255,0.80); text-wrap: balance; }
    #art-year { font-family: var(--serif); font-size: 16px; font-style: italic; color: var(--muted); margin-bottom: 18px; }
    #divider { width: 34px; height: 1px; background: rgba(255,255,255,0.18); margin-bottom: 15px; }
    #art-desc { font-family: var(--sans); font-size: 12px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.56); text-wrap: pretty; }
    #art-notes { font-family: var(--sans); font-size: 12px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.38); text-wrap: pretty; margin-top: 10px; font-style: italic; }

    #sidebar-bottom { margin-top: auto; }
    #learn-more {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--white); text-decoration: none; opacity: 0.50; transition: opacity 0.2s;
    }
    #learn-more:hover { opacity: 1; }

    #painting-panel { flex: 1; height: 100%; position: relative; overflow: hidden; background: #060606; }
    #painting-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: left center;
      display: block; opacity: 0; transition: opacity 1.1s ease;
    }
    #painting-img.loaded { opacity: 1; }
    #painting-loader {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: var(--sans); font-size: 13px; color: var(--muted); font-style: italic; pointer-events: none;
    }

    /* desktop top nav — matches about page */
    #topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 28px 40px;
      pointer-events: none;
    }
    #topnav-right {
      display: flex; align-items: center; gap: 28px;
      pointer-events: auto;
    }
    #topnav-right a {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #topnav-right a:hover { color: var(--white); }
    #topnav-right a.icon img { height: 14px; width: 14px; opacity: 0.50; display: block; transition: opacity 0.2s; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.8)); }
    #topnav-right a.icon:hover img { opacity: 1; }

    #view-full-btn {
      position: absolute; bottom: 28px; right: 32px; z-index: 3;
      background: var(--white); color: #0D0D0D;
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: none; cursor: pointer; padding: 9px 16px; transition: opacity 0.2s;
    }
    #view-full-btn:hover { opacity: 0.85; }
    #full-overlay { display: none; position: absolute; inset: 0; z-index: 4; align-items: center; justify-content: center; pointer-events: none; }
    #full-overlay.visible { display: flex; pointer-events: auto; }
    #full-overlay img {
      max-width: 60%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      border: 1px solid #fff;
      display: block;
    }

    /* ═══════════════════ MOBILE ═══════════════════ */
    #mobile-header { display: none; }
    #mobile-content { display: none; }

    @media (max-width: 768px) {
      html, body { overflow-y: auto; overflow-x: hidden; height: auto; }
      #page { flex-direction: column; height: auto; overflow: visible; }
      #sidebar { display: none; }
      #topnav { display: none; }
      #view-full-btn { display: none; }
      #full-overlay { display: none !important; }

      /* ONE unified header above the painting */
      #mobile-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 20px 14px; background: var(--bg); width: 100%;
      }
      #mobile-header img { height: 9px; width: auto; opacity: 0.90; }
      #mobile-header-right { display: flex; align-items: center; gap: 16px; }
      #mobile-header-right a {
        font-family: var(--sans); font-size: 11px; font-weight: 600;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(255,255,255,0.55); text-decoration: none;
      }

      #painting-panel { width: 100vw; height: auto; position: relative; overflow: hidden; flex-shrink: 0; }
      #painting-img { position: relative; width: 100%; height: auto; object-fit: unset; object-position: unset; display: block; opacity: 0; transition: opacity 1s ease; }
      #painting-img.loaded { opacity: 1; }
      #painting-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

      #mobile-content {
        display: flex; flex-direction: column;
        padding: 24px 20px 36px; background: var(--bg);
      }
      #mobile-title { font-family: var(--sans); font-size: 16px; font-weight: 700; line-height: 1.2; margin-bottom: 3px; text-wrap: balance; }
      #mobile-artist { font-family: var(--serif); font-size: 16px; font-style: italic; line-height: 1.2; margin-bottom: 2px; color: rgba(255,255,255,0.80); }
      #mobile-year { font-family: var(--serif); font-size: 16px; font-style: italic; color: var(--muted); margin-bottom: 18px; }
      #mobile-divider { width: 34px; height: 1px; background: rgba(255,255,255,0.18); margin-bottom: 14px; }
      #mobile-desc { font-family: var(--sans); font-size: 13px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.56); text-wrap: pretty; margin-bottom: 10px; }
      #mobile-notes { font-family: var(--sans); font-size: 13px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.38); text-wrap: pretty; font-style: italic; margin-bottom: 28px; }
      #mobile-bottom { display: flex; align-items: center; justify-content: space-between; }
      #mobile-learn-more { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--white); text-decoration: none; opacity: 0.55; }
      #mobile-nav { display: flex; align-items: center; gap: 10px; }
      #mobile-icons { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 24px 0 8px; }
      #mobile-icons a img { height: 20px; width: 20px; opacity: 0.35; transition: opacity 0.2s; display: block; object-fit: contain; }
      #mobile-icons a:hover img { opacity: 0.7; }
      #mobile-icons a.icon-mail img, #mobile-icons a.icon-globe img { height: 24px; width: 24px; }
    }
  </style>
</head>

<script>
const ARTWORKS = [
  { title: "The Raft of the Medusa", artist: "Théodore Géricault", date: "1818–1819", imageFile: "Théodore_Géricault_-_The_Raft_of_the_Medusa_-_WGA08630.jpg", wikiPage: "The_Raft_of_the_Medusa", desc: "Depicting the aftermath of the wreck of the French frigate Méduse, the painting shows survivors adrift on a makeshift raft after the ship ran aground on July 2, 1816. At least 150 people were set adrift; only 15 survived the 13 days before rescue, enduring starvation, dehydration, and cannibalism. The event became an international scandal attributed to the incompetence of the French captain." },
  { title: "The Third of May 1808", artist: "Francisco Goya", date: "1814", imageFile: "El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_in_Google_Earth.jpg", wikiPage: "The_Third_of_May_1808", desc: "The painting depicts the execution of Spanish civilians by Napoleonic soldiers following the Dos de Mayo Uprising in Madrid. Commissioned by the provisional government of Spain, it broke from conventional depictions of war by presenting the soldiers as anonymous, faceless executioners and the victims as recognizable human beings. It is widely considered a foundational work of modern art." },
  { title: "The Nightmare", artist: "Henry Fuseli", date: "1781", imageFile: "John_Henry_Fuseli_-_The_Nightmare.JPG", wikiPage: "The_Nightmare_(Fuseli)", desc: "The painting shows a woman in deep sleep with an incubus crouching on her chest, while a horse with blank white eyes peers through the parted curtain behind her. Its erotic and unsettling evocation of obsession was a commercial breakthrough for Fuseli when shown in 1782. He produced at least three further versions, and engraved prints circulated widely across Europe." },
  { title: "The Isle of the Dead", artist: "Arnold Böcklin", date: "1886", imageFile: "Isle_of_the_Dead_(Hermitage_Version).jpg", wikiPage: "Isle_of_the_Dead_(painting)", desc: "A white-shrouded figure stands in a small boat being rowed toward a rocky island dominated by tall cypress trees and sheer stone walls. Böcklin painted five versions of the composition between 1880 and 1886 and declined to explain the subject to anyone. Sigmund Freud owned a print of it, Adolf Hitler acquired one of the original versions, and at the turn of the century it was among the most widely reproduced images in the German-speaking world." },
  { title: "Death on a Pale Horse", artist: "Benjamin West", date: "1796", imageFile: "Death-on-a-pale-horse-west-1796.jpg", wikiPage: "Death_on_the_Pale_Horse", desc: "Inspired by apocalyptic imagery from the Book of Revelation, the composition depicts the four horsemen of the apocalypse amid a chaotic mass of writhing figures. West returned to the subject three times over thirty years: a drawing in 1783, this painting in 1796, and a monumental 25-foot canvas exhibited in 1817. All three versions are significant works in British Romantic painting." },
  { title: "A Lion Attacking a Horse", artist: "George Stubbs", date: "1762", imageFile: "George_Stubbs_-_A_Lion_Attacking_a_Horse_-_Google_Art_Project.jpg", wikiPage: "A_Lion_Attacking_a_Horse", desc: "The painting depicts a lion mounted on the back of a rearing white horse, claws sunk into its flesh as the horse twists in terror. Stubbs produced seventeen works on this theme over thirty years, all emphasizing the horse's terror and pain. The most probable inspiration was a large ancient Roman marble sculpture of the same subject that was well known in London artistic circles at the time. Stubbs was a trained anatomist, and the violence here is rendered with clinical precision." },
  { title: "A Philosopher Lecturing on the Orrery", artist: "Joseph Wright of Derby", date: "c. 1766", imageFile: "Wright_of_Derby,_The_Orrery.jpg", wikiPage: "A_Philosopher_Lecturing_on_the_Orrery", desc: "The painting depicts a lecturer demonstrating an orrery, a mechanical model of the solar system, to a small audience gathered in a darkened room. A lamp placed at the center of the device stands in for the sun, illuminating the faces of the onlookers with dramatic chiaroscuro. It was Wright's first major candlelit work to replace a classical subject with a scientific one at the center of the composition." },
  { title: "An Experiment on a Bird in the Air Pump", artist: "Joseph Wright of Derby", date: "1768", imageFile: "An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby,_1768.jpg", wikiPage: "An_Experiment_on_a_Bird_in_the_Air_Pump", desc: "The painting shows a natural philosopher recreating one of Robert Boyle's air pump experiments before a group of onlookers, removing air from a glass globe containing a live bird. The viewers respond variously with scientific detachment, distress, and indifference. It was among the first paintings to treat a scientific subject with the reverential scale and lighting previously reserved for religious history painting." },
  { title: "The Seventh Plague of Egypt", artist: "John Martin", date: "1823", imageFile: "Martin,_John_-_The_Seventh_Plague_-_1823.jpg", wikiPage: "The_Seventh_Plague_of_Egypt", desc: "The painting depicts Moses calling down the seventh plague, a storm of thunder and hail, upon Egypt as divine punishment while the Israelites remain enslaved. Martin drew on contemporary archaeological discoveries of Egyptian architecture to construct the monumental setting, rendering the human figures tiny against the scale of the built environment and the destruction falling from the sky." },
  { title: "The Gulf Stream", artist: "Winslow Homer", date: "1899", imageFile: "Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg", wikiPage: "The_Gulf_Stream_(painting)", desc: "The painting shows a solitary Black man lying on a dismasted, rudderless fishing boat surrounded by sharks, with a waterspout visible on the horizon and a sailing ship in the far distance. Homer worked on the theme for over a decade, producing numerous related watercolors before completing this oil. When asked about the man's fate, Homer replied that the sharks, the elements, and Providence would attend to that." },
  { title: "The Deluge", artist: "Francis Danby", date: "1840", imageFile: "Francis_Danby_-_The_Deluge_-_Google_Art_Project.jpg", wikiPage: "The_Deluge_(Danby)", desc: "The painting depicts the biblical flood at its height, with crowds of figures clinging to rocks and each other as the waters rise around them. Danby exhibited it at the Royal Academy in 1840 alongside John Martin's Eve of the Deluge, setting up a direct competition between the two leading painters of apocalyptic spectacle in Britain. Critics considered it Danby's masterpiece." },
  { title: "The Wreck of a Transport Ship", artist: "J. M. W. Turner", date: "1810", imageFile: "Shipwreck_turner.jpg", wikiPage: "The_Wreck_of_a_Transport_Ship", desc: "The painting depicts a ship overwhelmed by wind and waves during a violent storm, with lifeboats attempting to rescue survivors from the doomed vessel. Although Turner had begun preparatory sketches before the event, the work gained topicality when the HMS Minotaur was wrecked off the Dutch coast with heavy loss of life in November 1810, shortly after the painting was completed." },
  { title: "Ulysses Deriding Polyphemus", artist: "J. M. W. Turner", date: "1829", imageFile: "Turner_-_Ulysses_deriding_Polyphemus_1829.jpg", wikiPage: "Ulysses_Deriding_Polyphemus", desc: "The painting depicts a scene from Homer's Odyssey in which Odysseus stands on his ship and taunts the blinded cyclops Polyphemus, who looms as a dark mass behind the mountains on the left. Turner considered it one of his most important works. The sea is lit with an extraordinary golden light, and the figures of the Nereids can be seen in the waves beneath the ship." },
  { title: "Ophelia", artist: "John Everett Millais", date: "1851–1852", imageFile: "John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg", wikiPage: "Ophelia_(painting)", desc: "The painting depicts Ophelia from Shakespeare's Hamlet floating in a stream moments before her drowning, her expression serene and her hands open above the water. Millais painted the landscape on location in Surrey over five months, and later had the model Elizabeth Siddal pose in a heated bath for the figure. The botanically precise flowers surrounding her each carry symbolic meaning." },
  { title: "The Hay Wain", artist: "John Constable", date: "1821", imageFile: "John_Constable_-_The_Hay_Wain_(1821).jpg", wikiPage: "The_Hay_Wain", desc: "The painting shows a horse-drawn cart fording a shallow river beside a water mill in the Stour Valley on the border of Suffolk and Essex. Constable made dozens of oil sketches for the work, pioneering a method of direct outdoor observation that was highly unusual for the period. When it was shown in Paris in 1824 it caused a sensation and directly influenced the generation of French painters that followed." },
  { title: "The Sleep of Reason Produces Monsters", artist: "Francisco Goya", date: "1799", imageFile: "Francisco_José_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg", wikiPage: "The_Sleep_of_Reason_Produces_Monsters", desc: "The 43rd plate from Goya's Los Caprichos. A man sleeps at his desk as owls and bats swarm above him and a lynx watches in silence. The inscription reads: the sleep of reason produces monsters.", notes: "Adam's Note: This piece becomes more interesting when paired with Goya's quote: \"Imagination abandoned by reason produces impossible monsters; united with her, she is the mother of the arts and source of their wonders\" — as it flips the original meaning. Rather than prioritizing reason, it's positioned as the mechanism through which imagination reaches its fullest expression." },
  { title: "Prometheus Bound", artist: "Peter Paul Rubens", date: "c. 1612", imageFile: "Peter_Paul_Rubens,_Flemish_(active_Italy,_Antwerp,_and_England)_-_Prometheus_Bound_-_Google_Art_Project.jpg", wikiPage: "Prometheus_Bound_(Rubens)", desc: "Prometheus is chained to a rock as an eagle tears at his liver, which regenerates each night so the torment can resume. Rubens painted the figure; Frans Snyders rendered the eagle.", notes: "Adam's Note: Worth reading the full backstory. A few things worth noticing — the lack of a clear focal point, and the way it reads as a cautionary tale of another being who flew too close to the sun by disobeying the divine order of things. Even if — and maybe especially because — that disobedience came in the name of advancing humanity. At what point does nature step in?" },
  { title: "The Great Day of His Wrath", artist: "John Martin", date: "1851–1853", imageFile: "John_Martin_-_The_Great_Day_of_His_Wrath_-_Google_Art_Project.jpg", wikiPage: "The_Great_Day_of_His_Wrath", desc: "Cities collapse, mountains split apart, and the earth is consumed by fire and darkness in this depiction of the destruction of Babylon from the Book of Revelation. Martin suffered a stroke while completing it in 1853. It forms one panel of a triptych called The Last Judgement, and is considered among the most ambitious apocalyptic paintings ever made." },
  { title: "The Desperate Man", artist: "Gustave Courbet", date: "1843", imageFile: "Gustave_Courbet_-_Le_Désespéré_(1843).jpg", wikiPage: "The_Desperate_Man", desc: "A self-portrait in which Courbet grips his own head with both hands and stares directly out of the canvas. He painted it in his mid-twenties, before his career had taken hold.", notes: "Adam's Note: Less a critique of the painting and more an observation — it would be practically impossible today to produce a self portrait of any kind and have a person 200 years into the future still writing about it. Maybe it's the goatee." },
  { title: "A Storm in the Rocky Mountains", artist: "Albert Bierstadt", date: "1866", imageFile: "Albert_Bierstadt_-_A_Storm_in_the_Rocky_Mountains,_Mt._Rosalie_-_Google_Art_Project.jpg", wikiPage: "A_Storm_in_the_Rocky_Mountains,_Mt._Rosalie", desc: "Storm clouds build over jagged peaks as a valley below is caught in a shaft of light. Bierstadt painted this after an 1863 expedition to the Colorado Rockies. At over four meters wide, the canvas was designed to overwhelm.", notes: "Adam's Note: Not to sound like a crazy hippy, but the composition frames the scene like a conversation between the sky and the earth — and with that a whole can of symbolic worms opens. The scene can almost in one frame be an entire movie, with the white mountaintop peering through clouds and the blacked-out region between us and it representing different points in a story arc." },
  { title: "Interior of the Pantheon", artist: "Giovanni Paolo Panini", date: "1747", imageFile: "Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon,_Rome_-_Google_Art_Project.jpg", wikiPage: "Giovanni_Paolo_Panini", desc: "The interior of Rome's ancient temple rendered with architectural precision, the oculus at the top casting a circle of light onto the floor below. Panini painted the Pantheon multiple times across his career, each version an obsessive cataloguing of the space. The painting captures the uncanny quality of ancient Roman engineering — the sense that the building is impossible and yet indisputably there." },
  { title: "The Anatomy Lesson of Dr. Deijman", artist: "Rembrandt van Rijn", date: "1656", imageFile: "Rembrandt_-_Anatomische_les_van_Dr._Jan_Deijman.jpg", wikiPage: "The_Anatomy_Lesson_of_Dr._Deijman", desc: "Only a fragment of the original painting survives after a fire in 1723. What remains shows the opened skull and exposed brain of a cadaver, foreshortened toward the viewer in a pose deliberately echoing Mantegna's Dead Christ. Dr. Deijman stands behind, supervising. Rembrandt turned a medical demonstration into something that reads as both scientific and sacred." },
  { title: "The Tower of Babel", artist: "Pieter Bruegel the Elder", date: "1563", imageFile: "Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_(Vienna)_-_Google_Art_Project.jpg", wikiPage: "The_Tower_of_Babel_(Bruegel)", desc: "A colossal spiral tower under construction dominates the canvas while tiny figures swarm across its surface. Bruegel based the architecture on the Colosseum in Rome, which he had visited. The tower is unfinished and already crumbling — the project is doomed from within. In the foreground, a king receives the builders. No one appears to notice the collapse beginning above them." },
  { title: "The Slave Ship", artist: "J. M. W. Turner", date: "1840", imageFile: "Slave-ship.jpg", wikiPage: "The_Slave_Ship", desc: "Originally titled Slavers Throwing Overboard the Dead and Dying, the painting shows a ship sailing through a churning sea, leaving scattered human forms in its wake. Turner was likely moved to paint this after reading an account of the Zong massacre, in which the captain of a slave ship ordered captives thrown overboard to claim insurance money. It was exhibited to coincide with an anti-slavery conference in London." },
  { title: "The Triumph of Death", artist: "Pieter Bruegel the Elder", date: "c. 1562", imageFile: "Pieter_Bruegel_the_Elder_-_The_Triumph_of_Death_-_WGA3389.jpg", wikiPage: "The_Triumph_of_Death", desc: "An army of skeletons sweeps across a blackened, desolate landscape, overwhelming the living regardless of rank or wealth. Fires burn in the distance and the sea is littered with shipwrecks. No one in the painting escapes — kings, cardinals, and peasants are all consumed with equal indifference." },
  { title: "The Apotheosis of War", artist: "Vasily Vereshchagin", date: "1871", imageFile: "1871_Vereshchagin_Apotheose_des_Krieges_anagoria.JPG", wikiPage: "The_Apotheosis_of_War", desc: "A pyramid of human skulls sits in a scorched, empty landscape outside the ruins of a city, crows circling above. Vereshchagin dedicated the painting to all great conquerors, past, present, and to come. It is part of his Turkestan Series, based on his own experience traveling with the Russian army through Central Asia." },
  { title: "Fight with Cudgels", artist: "Francisco Goya", date: "c. 1820–1823", imageFile: "Francisco_de_Goya_y_Lucientes_-_Duel_with_Cudgels_-_WGA10102.jpg", wikiPage: "Fight_with_Cudgels", desc: "Two men beat each other with clubs while trapped knee-deep in mud or sand, unable to retreat or escape the fight. One of Goya's Black Paintings, made directly onto the walls of his house in his final years in Spain. There is no winner implied — only two figures locked in mutual, futile destruction." },
  { title: "The Course of Empire: The Savage State", artist: "Thomas Cole", date: "1834", imageFile: "Cole_Thomas_The_Course_of_Empire_The_Savage_State_1836.jpg", wikiPage: "The_Course_of_Empire_(paintings)", desc: "The first of five paintings tracing the rise and fall of an imagined civilization. Hunters in skins move through an untouched wilderness as storm clouds part at dawn. Cole described it as nature springing from chaos — the world before settlement, before architecture, before history begins to accumulate." },
  { title: "The Course of Empire: The Arcadian or Pastoral State", artist: "Thomas Cole", date: "1834", imageFile: "Cole_Thomas_The_Course_of_Empire_The_Arcadian_or_Pastoral_State_1836.jpg", wikiPage: "The_Course_of_Empire_(paintings)", desc: "The second painting in Cole's cycle shows the same valley settled into a peaceful agrarian society. Shepherds tend flocks, a temple is under construction, and the wilderness has given way to cultivation. It represents what Cole considered the most stable and admirable phase of civilization — before ambition takes hold." },
  { title: "The Course of Empire: The Consummation of Empire", artist: "Thomas Cole", date: "1836", imageFile: "Cole_Thomas_The_Consummation_The_Course_of_the_Empire_1836.jpg", wikiPage: "The_Course_of_Empire_(paintings)", desc: "The third and largest painting in the series shows the civilization at its absolute peak — marble architecture, crowds, processions, immense wealth on display. Cole intended this moment of maximum splendor to carry its own warning. The seeds of collapse are already present in the excess itself." },
  { title: "The Course of Empire: Destruction", artist: "Thomas Cole", date: "1836", imageFile: "Cole_Thomas_The_Course_of_Empire_Destruction_1836.jpg", wikiPage: "The_Course_of_Empire_(paintings)", desc: "The fourth painting shows the city under siege, burning, its population slaughtered or fleeing. Cole wrote to a friend that he had been engaged in sacking and burning a city for weeks while painting it. A headless colossal statue, modeled on the Borghese Warrior, presides over the chaos — reason and order already gone." },
  { title: "The Course of Empire: Desolation", artist: "Thomas Cole", date: "1836", imageFile: "Cole_Thomas_The_Course_of_Empire_Desolation_1836.jpg", wikiPage: "The_Course_of_Empire_(paintings)", desc: "The final painting in the cycle, set decades after the city's destruction. The ruins stand empty under a rising moon, overtaken by vines and birds. No human figures remain. The same boulder that appeared atop the cliff in the first painting still stands — the only constant across the entire five-part story." },
  { title: "Et in Arcadia Ego", artist: "Nicolas Poussin", date: "1637–1638", imageFile: "Nicolas_Poussin_-_Et_in_Arcadia_ego_(deuxième_version).jpg", wikiPage: "Et_in_Arcadia_ego_(Poussin)", desc: "Three shepherds and a woman gather around a tomb in an idealized pastoral landscape, tracing the Latin inscription Et in Arcadia ego — even in Arcadia, I am there. The phrase is understood to be spoken by Death itself. Poussin set mortality directly into utopia, suggesting that no idyll, however perfect, is exempt from it." }
];

const params = new URLSearchParams(location.search);
const TOTAL  = ARTWORKS.length;
const LAST   = TOTAL - 1;
const startDate = Date.UTC(2026, 4, 29);
const todayUTC  = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
const daysSinceStart = Math.floor((todayUTC - startDate) / 86400000);
const todayIdx = Math.min(Math.max(daysSinceStart, 0), LAST);

let idx = params.has('day') ? ((parseInt(params.get('day'),10)%TOTAL)+TOTAL)%TOTAL : todayIdx;
const artwork = ARTWORKS[idx];

const prevBtn = document.getElementById('nav-prev');
if (idx > 0) { prevBtn.classList.remove('disabled'); prevBtn.href = `index.html?day=${idx-1}`; }
const nextBtn = document.getElementById('nav-next');
if (idx < todayIdx) { nextBtn.classList.remove('disabled'); nextBtn.href = `index.html?day=${idx+1}`; }
const mPrev = document.getElementById('mobile-prev');
if (idx > 0) { mPrev.classList.remove('disabled'); mPrev.href = `index.html?day=${idx-1}`; }
const mNext = document.getElementById('mobile-next');
if (idx < todayIdx) { mNext.classList.remove('disabled'); mNext.href = `index.html?day=${idx+1}`; }

document.getElementById('art-title').textContent  = artwork.title;
document.getElementById('art-artist').textContent = artwork.artist;
document.getElementById('art-year').textContent   = artwork.date;
document.getElementById('art-desc').textContent   = artwork.desc;
document.getElementById('art-notes').textContent  = artwork.notes || '';
document.getElementById('learn-more').href = `https://en.wikipedia.org/wiki/${artwork.wikiPage}`;
document.getElementById('mobile-title').textContent  = artwork.title;
document.getElementById('mobile-artist').textContent = artwork.artist;
document.getElementById('mobile-year').textContent   = artwork.date;
document.getElementById('mobile-desc').textContent   = artwork.desc;
document.getElementById('mobile-notes').textContent  = artwork.notes || '';
document.getElementById('mobile-learn-more').href = `https://en.wikipedia.org/wiki/${artwork.wikiPage}`;

const loader = document.getElementById('painting-loader');
const paintImg = document.getElementById('painting-img');
const fullImg  = document.getElementById('full-img');

async function loadImage() {
  try {
    const url  = `https://en.wikipedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(artwork.imageFile)}&prop=imageinfo&iiprop=url&iiurlwidth=2400&format=json&origin=*`;
    const res  = await fetch(url);
    const data = await res.json();
    const page = Object.values(data.query.pages)[0];
    const info = page?.imageinfo?.[0];
    const src  = info?.thumburl || info?.url;
    if (!src) { loader.textContent = 'Image unavailable'; return; }
    paintImg.src = src; fullImg.src = src;
    paintImg.alt = fullImg.alt = artwork.title;
    paintImg.onload = () => { paintImg.classList.add('loaded'); loader.style.display = 'none'; };
    paintImg.onerror = () => { loader.textContent = 'Image unavailable'; };
  } catch(e) { loader.textContent = 'Could not load image.'; }
}
loadImage();

const overlay = document.getElementById('full-overlay');
const viewBtn = document.getElementById('view-full-btn');
let fullVisible = false;
viewBtn.addEventListener('click', () => {
  fullVisible = !fullVisible;
  overlay.classList.toggle('visible', fullVisible);
  viewBtn.textContent = fullVisible ? 'Close' : 'View in Full';
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) { fullVisible = false; overlay.classList.remove('visible'); viewBtn.textContent = 'View in Full'; }
});
</script>
</body>
</html>
