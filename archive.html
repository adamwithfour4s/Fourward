<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0D0D0D; --white: #fff; --muted: rgba(255,255,255,0.42); --sans: 'Google Sans Flex', sans-serif; --serif: 'Radley', Georgia, serif; }
    html, body { min-height: 100%; background: var(--bg); color: var(--white); }
    body { padding: 32px 44px 72px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 52px; }
    #logo img { height: 14px; opacity: 0.90; }
    #nav-right { display: flex; gap: 24px; }
    #nav-right a { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    #nav-right a:hover { color: var(--white); }

    h1 { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px; }

    .card { display: block; text-decoration: none; color: var(--white); position: relative; aspect-ratio: 16/9; overflow: hidden; background: rgba(255,255,255,0.04); }
    .card img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; opacity: 0; transition: opacity 0.7s ease, transform 0.4s ease; }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.03); opacity: 0.72; }
    .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 44px 16px 14px; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%); }
    .card-title { font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-artist { font-family: var(--serif); font-size: 12px; font-style: italic; color: rgba(255,255,255,0.58); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-day { position: absolute; top: 12px; left: 13px; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.48); background: rgba(0,0,0,0.52); padding: 3px 7px; border-radius: 3px; }
    .card-skel { width: 100%; height: 100%; background: rgba(255,255,255,0.05); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.7} }

    footer { margin-top: 52px; }
    footer img { height: 13px; opacity: 0.18; }
  </style>
</head>
<body>
<header>
  <div id="logo"><img src="logo.png" alt="Fourward" /></div>
  <div id="nav-right">
    <a href="about.html">About</a>
    <a href="index.html">Today</a>
  </div>
</header>

<h1>Archive</h1>
<div id="grid"></div>
<footer><img src="44.png" alt="44" /></footer>

<script>
const ARTWORKS = [
  { title: "The Raft of the Medusa",      artist: "Théodore Géricault",  wikiPage: "The_Raft_of_the_Medusa" },
  { title: "The Third of May 1808",       artist: "Francisco Goya",       wikiPage: "The_Third_of_May_1808" },
  { title: "Two Men Contemplating the Moon", artist: "Caspar David Friedrich", wikiPage: "Two_Men_Contemplating_the_Moon" },
  { title: "Death on a Pale Horse",       artist: "Benjamin West",        wikiPage: "Death_on_a_Pale_Horse_(West)" },
  { title: "The Seventh Plague of Egypt", artist: "John Martin",          wikiPage: "John_Martin_(painter)" },
];

const grid = document.getElementById('grid');

// Show all entries, newest first
[...ARTWORKS.entries()].reverse().forEach(([idx, aw]) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `index.html?day=${idx}`;

  const badge = document.createElement('div');
  badge.className = 'card-day';
  badge.textContent = `Day ${idx + 1}`;
  a.appendChild(badge);

  const skel = document.createElement('div');
  skel.className = 'card-skel';
  a.appendChild(skel);

  const info = document.createElement('div');
  info.className = 'card-info';
  info.innerHTML = `<div class="card-title">${aw.title}</div><div class="card-artist">${aw.artist}</div>`;
  a.appendChild(info);

  grid.appendChild(a);

  // fetch thumbnail via Wikipedia API
  const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(aw.wikiPage)}&prop=pageimages&pithumbsize=600&format=json&origin=*`;
  fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
      const pages = data.query.pages;
      const page  = pages[Object.keys(pages)[0]];
      const src   = page?.thumbnail?.source;
      if (src) {
        skel.remove();
        const img = document.createElement('img');
        img.src = src; img.alt = aw.title;
        img.onload = () => img.classList.add('loaded');
        a.insertBefore(img, badge);
      } else {
        skel.style.animation = 'none'; skel.style.opacity = '0.04';
      }
    })
    .catch(() => { skel.style.animation = 'none'; skel.style.opacity = '0.04'; });
});
</script>
</body>
</html>
