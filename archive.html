<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D0D; --white: #FFFFFF; --muted: rgba(255,255,255,0.45);
      --sans: 'Google Sans Flex', sans-serif; --serif: 'Radley', Georgia, serif;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--white); }
    body { padding: 36px 48px 80px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
    #logo img { height: 20px; width: auto; opacity: 0.92; }
    #back-link {
      font-family: var(--sans); font-size: 12px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      text-decoration: none; display: flex; align-items: center; gap: 9px; transition: color 0.2s;
    }
    #back-link:hover { color: var(--white); }
    #back-link svg { width: 12px; height: 12px; }

    h1 {
      font-family: var(--sans); font-size: 12px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 28px;
    }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px; }

    .card {
      display: block; text-decoration: none; color: var(--white);
      position: relative; aspect-ratio: 4/3; overflow: hidden;
      background: rgba(255,255,255,0.04);
    }
    .card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0; transition: opacity 0.6s ease, transform 0.4s ease;
    }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.03); opacity: 0.7; }

    .card-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 40px 16px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
    }
    .card-title {
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-artist {
      font-family: var(--serif); font-size: 12px; font-style: italic;
      color: rgba(255,255,255,0.6); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-day {
      position: absolute; top: 12px; left: 14px;
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.5);
      padding: 3px 8px; border-radius: 3px;
    }
    .card-skel {
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.05);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

    footer {
      margin-top: 56px; display: flex; align-items: center;
    }
    footer img { height: 18px; width: auto; opacity: 0.2; }
  </style>
</head>
<body>

<header>
  <div id="logo"><img src="logo.png" alt="Fourward" /></div>
  <a id="back-link" href="index.html">
    <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7.5 1.5L3 6L7.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Today's work
  </a>
</header>

<h1>Archive</h1>
<div id="grid"></div>

<footer><img src="44.png" alt="44" /></footer>

<script>
const ARTWORKS = [
  { objectID: 10554,   title: "Watson and the Shark",                      artist: "John Singleton Copley" },
  { objectID: 437854,  title: "Whalers",                                   artist: "J. M. W. Turner" },
  { objectID: 459174,  title: "Greifswald in Moonlight",                   artist: "Caspar David Friedrich" },
  { objectID: 49741,   title: "Don Manuel Osorio Manrique de Zuñiga",      artist: "Francisco Goya" },
  { objectID: 437984,  title: "Wheat Field with Cypresses",                 artist: "Vincent van Gogh" },
  { objectID: 459074,  title: "The Penitent Magdalene",                    artist: "Georges de La Tour" },
  { objectID: 647152,  title: "Whalers (Boiling Blubber) Entangled in Flaw Ice", artist: "J. M. W. Turner" }
];

// Show all 7, newest first (day 7 → day 1)
const grid = document.getElementById('grid');
const reversed = [...ARTWORKS.entries()].reverse();

reversed.forEach(([idx, aw]) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `index.html?day=${idx}`;

  const badge = document.createElement('div');
  badge.className = 'card-day';
  badge.textContent = `Day ${idx + 1}`;
  a.appendChild(badge);

  const skel = document.createElement('div');
  skel.className = 'card-skel';
  a.appendChild(skel);

  const info = document.createElement('div');
  info.className = 'card-info';
  info.innerHTML = `<div class="card-title">${aw.title}</div><div class="card-artist">${aw.artist}</div>`;
  a.appendChild(info);

  grid.appendChild(a);

  fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${aw.objectID}`)
    .then(r => r.json())
    .then(data => {
      skel.remove();
      const src = data.primaryImageSmall || data.primaryImage;
      if (src) {
        const img = document.createElement('img');
        img.src = src; img.alt = aw.title;
        img.onload = () => img.classList.add('loaded');
        a.insertBefore(img, badge);
      }
    })
    .catch(() => { skel.style.animation = 'none'; skel.style.opacity = '0.04'; });
});
</script>
</body>
</html>
