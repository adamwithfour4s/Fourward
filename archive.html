<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Fourward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=Radley:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0D0D0D; --white: #fff; --muted: rgba(255,255,255,0.40); --sans: 'Google Sans Flex', sans-serif; --serif: 'Radley', Georgia, serif; }
    html, body { min-height: 100%; background: var(--bg); color: var(--white); }
    body { padding: 30px 44px 64px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; padding: 0; }
    #logo { cursor: pointer; }
    #logo img { height: 14px; opacity: 0.90; }
    #nav-right { display: flex; align-items: center; gap: 28px; }
    #nav-right a { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; }
    #nav-right a:hover { color: var(--white); }
    #mob-header { display: none; }

    @media (max-width: 768px) {
      body { padding: 0 0 64px; }
      header { display: none; }
      h1 { padding: 0 20px; }
      #grid { padding: 0 2px; }
      #mob-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 20px 14px; width: 100%; margin-bottom: 22px;
      }
      #mob-header img { height: 9px; opacity: 0.90; }
      #mob-header-right { display: flex; align-items: center; gap: 16px; }
      #mob-header-right a {
        font-family: 'Google Sans Flex', sans-serif; font-size: 11px; font-weight: 600;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(255,255,255,0.55); text-decoration: none;
      }
    }
    #nav-right { display: flex; gap: 22px; }
    #nav-right a { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    #nav-right a:hover { color: var(--white); }

    h1 { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px; }

    .card { display: block; text-decoration: none; color: var(--white); position: relative; aspect-ratio: 16/9; overflow: hidden; background: rgba(255,255,255,0.04); }
    .card img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; opacity: 0; transition: opacity 0.7s ease, transform 0.4s ease; }
    .card img.loaded { opacity: 1; }
    .card:hover img { transform: scale(1.03); opacity: 0.70; }
    .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 48px 16px 14px; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%); }
    .card-title { font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-artist { font-family: var(--serif); font-size: 12px; font-style: italic; color: rgba(255,255,255,0.56); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-day { position: absolute; top: 11px; left: 13px; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.46); background: rgba(0,0,0,0.54); padding: 3px 7px; border-radius: 3px; }
    .card-skel { width: 100%; height: 100%; background: rgba(255,255,255,0.05); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.60} }
  </style>
</head>
<body>
<div id="mob-header">
  <a href="index.html"><img src="logo.png" alt="Fourward" /></a>
  <div id="mob-header-right">
    <a href="index.html">Daily Art</a>
    <a href="about.html">About</a>
    <a href="archive.html">Archive</a>
  </div>
</div>
<header>
  <a id="logo" href="index.html"><img src="logo.png" alt="Fourward" /></a>
  <div id="nav-right">
    <a href="index.html">Daily Art</a>
    <a href="about.html">About</a>
    <a href="archive.html">Archive</a>
  </div>
</header>

<h1>Archive</h1>
<div id="grid"></div>

<script>
const ARTWORKS = [
  { title: "The Raft of the Medusa",                  artist: "Théodore Géricault",    imageFile: "Théodore_Géricault_-_The_Raft_of_the_Medusa_-_WGA08630.jpg" },
  { title: "The Third of May 1808",                   artist: "Francisco Goya",         imageFile: "El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_in_Google_Earth.jpg" },
  { title: "The Nightmare",                           artist: "Henry Fuseli",           imageFile: "John_Henry_Fuseli_-_The_Nightmare.JPG" },
  { title: "The Isle of the Dead",                    artist: "Arnold Böcklin",         imageFile: "Isle_of_the_Dead_(Hermitage_Version).jpg" },
  { title: "Death on a Pale Horse",                   artist: "Benjamin West",          imageFile: "Death-on-a-pale-horse-west-1796.jpg" },
  { title: "A Lion Attacking a Horse",                artist: "George Stubbs",          imageFile: "George_Stubbs_-_A_Lion_Attacking_a_Horse_-_Google_Art_Project.jpg" },
  { title: "A Philosopher Lecturing on the Orrery",   artist: "Joseph Wright of Derby", imageFile: "Wright_of_Derby,_The_Orrery.jpg" },
  { title: "An Experiment on a Bird in the Air Pump", artist: "Joseph Wright of Derby", imageFile: "An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby,_1768.jpg" },
  { title: "The Seventh Plague of Egypt",             artist: "John Martin",            imageFile: "Martin,_John_-_The_Seventh_Plague_-_1823.jpg" },
  { title: "The Gulf Stream",                         artist: "Winslow Homer",           imageFile: "Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg" },
  { title: "The Deluge",                              artist: "Francis Danby",            imageFile: "Francis_Danby_-_The_Deluge_-_Google_Art_Project.jpg" },
  { title: "The Wreck of a Transport Ship",           artist: "J. M. W. Turner",          imageFile: "Shipwreck_turner.jpg" },
  { title: "Ulysses Deriding Polyphemus",             artist: "J. M. W. Turner",          imageFile: "Turner_-_Ulysses_deriding_Polyphemus_1829.jpg" },
  { title: "Ophelia",                                 artist: "John Everett Millais",     imageFile: "John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg" },
  { title: "The Hay Wain",                           artist: "John Constable",          imageFile: "John_Constable_-_The_Hay_Wain_(1821).jpg" },
  { title: "The Sleep of Reason Produces Monsters",  artist: "Francisco Goya",           imageFile: "Francisco_José_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg" },
  { title: "Prometheus Bound",                       artist: "Peter Paul Rubens",        imageFile: "Peter_Paul_Rubens,_Flemish_(active_Italy,_Antwerp,_and_England)_-_Prometheus_Bound_-_Google_Art_Project.jpg" },
  { title: "The Great Day of His Wrath",             artist: "John Martin",              imageFile: "John_Martin_-_The_Great_Day_of_His_Wrath_-_Google_Art_Project.jpg" },
  { title: "The Desperate Man",                      artist: "Gustave Courbet",          imageFile: "Gustave_Courbet_-_Le_Désespéré_(1843).jpg" },
  { title: "A Storm in the Rocky Mountains",         artist: "Albert Bierstadt",         imageFile: "Albert_Bierstadt_-_A_Storm_in_the_Rocky_Mountains,_Mt._Rosalie_-_Google_Art_Project.jpg" },
  { title: "Interior of the Pantheon",               artist: "Giovanni Paolo Panini",    imageFile: "Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon,_Rome_-_Google_Art_Project.jpg" },
  { title: "The Anatomy Lesson of Dr. Deijman",      artist: "Rembrandt van Rijn",       imageFile: "Rembrandt_-_Anatomische_les_van_Dr._Jan_Deijman.jpg" },
  { title: "The Tower of Babel",                     artist: "Pieter Bruegel the Elder", imageFile: "Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_(Vienna)_-_Google_Art_Project.jpg" },
  { title: "The Slave Ship",                         artist: "J. M. W. Turner",          imageFile: "Slave-ship.jpg" },
  { title: "The Triumph of Death",                   artist: "Pieter Bruegel the Elder", imageFile: "Pieter_Bruegel_the_Elder_-_The_Triumph_of_Death_-_WGA3389.jpg" },
  { title: "The Apotheosis of War",                  artist: "Vasily Vereshchagin",       imageFile: "1871_Vereshchagin_Apotheose_des_Krieges_anagoria.JPG" },
  { title: "Fight with Cudgels",                      artist: "Francisco Goya",            imageFile: "Francisco_de_Goya_y_Lucientes_-_Duel_with_Cudgels_-_WGA10102.jpg" },
  { title: "The Course of Empire: The Savage State",  artist: "Thomas Cole",               imageFile: "Cole_Thomas_The_Course_of_Empire_The_Savage_State_1836.jpg" },
  { title: "The Course of Empire: The Arcadian or Pastoral State", artist: "Thomas Cole",  imageFile: "Cole_Thomas_The_Course_of_Empire_The_Arcadian_or_Pastoral_State_1836.jpg" },
  { title: "The Course of Empire: The Consummation of Empire", artist: "Thomas Cole",      imageFile: "Cole_Thomas_The_Consummation_The_Course_of_the_Empire_1836.jpg" },
  { title: "The Course of Empire: Destruction",       artist: "Thomas Cole",               imageFile: "Cole_Thomas_The_Course_of_Empire_Destruction_1836.jpg" },
  { title: "The Course of Empire: Desolation",        artist: "Thomas Cole",               imageFile: "Cole_Thomas_The_Course_of_Empire_Desolation_1836.jpg" },
  { title: "Et in Arcadia Ego",                       artist: "Nicolas Poussin",            imageFile: "Nicolas_Poussin_-_Et_in_Arcadia_ego_(deuxième_version).jpg" },
];

const grid = document.getElementById('grid');

// Calendar-locked: figure out which index is "today" in EST
const startDate = Date.UTC(2026, 4, 29);
const todayUTC  = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
const daysSinceStart = Math.floor((todayUTC - startDate) / 86400000);
const todayIdx = Math.min(Math.max(daysSinceStart, 0), ARTWORKS.length - 1);

// Only show entries up to and including today — future ones are hidden
const visibleArtworks = [...ARTWORKS.entries()].filter(([idx]) => idx <= todayIdx);
[...visibleArtworks].reverse().forEach(([idx, aw]) => {
  const a = document.createElement('a');
  a.className = 'card'; a.href = `index.html?day=${idx}`;

  const badge = document.createElement('div');
  badge.className = 'card-day';
  badge.textContent = idx === todayIdx ? 'Today' : `Day ${idx + 1}`;
  a.appendChild(badge);

  const skel = document.createElement('div'); skel.className = 'card-skel';
  a.appendChild(skel);

  const info = document.createElement('div'); info.className = 'card-info';
  info.innerHTML = `<div class="card-title">${aw.title}</div><div class="card-artist">${aw.artist}</div>`;
  a.appendChild(info);
  grid.appendChild(a);

  // Fetch image via Wikipedia imageinfo API
  const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(aw.imageFile)}&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
  fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
      const page = Object.values(data.query.pages)[0];
      const src  = page?.imageinfo?.[0]?.thumburl || page?.imageinfo?.[0]?.url;
      if (src) {
        skel.remove();
        const img = document.createElement('img');
        img.src = src; img.alt = aw.title;
        img.onload = () => img.classList.add('loaded');
        a.insertBefore(img, badge);
      } else { skel.style.animation = 'none'; skel.style.opacity = '0.04'; }
    })
    .catch(() => { skel.style.animation = 'none'; skel.style.opacity = '0.04'; });
});
</script>
</body>
</html>
